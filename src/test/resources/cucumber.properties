# ========================================
# Configuración de Cucumber
# ========================================

# Desactivar publicación automática de reportes en cucumber.io
cucumber.publish.enabled=false
cucumber.publish.quiet=true

# Habilitar colores ANSI en la consola para mejor visualización
cucumber.ansi-colors.disabled=false

# Modo strict: falla si hay steps no implementados
cucumber.execution.strict=true

# Dry run: verifica sintaxis sin ejecutar (false para ejecutar normalmente)
cucumber.execution.dry-run=false

# Orden de ejecución de escenarios (random para detectar dependencias)
cucumber.execution.order=random

# Configuración de snippets para steps no implementados
# Opciones: underscore, camelcase
cucumber.snippet-type=camelcase

# IMPORTANTE: Glue debe apuntar al paquete base que contiene TANTO
# CucumberSpringConfiguration como el paquete steps/
# Así Cucumber encuentra ambos
cucumber.glue=co.edu.hotel.empleadoservice.bdd

# Features: ubicación de archivos .feature
cucumber.features=classpath:features

# Plugins de reporte
# pretty: salida legible en consola
# html: reporte HTML navegable
# json: para integración con CI/CD
# junit: formato XML para Jenkins/GitLab CI
cucumber.plugin=\
  pretty,\
  html:target/cucumber-reports/cucumber.html,\
  json:target/cucumber-reports/cucumber.json,\
  junit:target/cucumber-reports/cucumber.xml

# Filtros (opcional - comentado por defecto)
# cucumber.filter.tags=@actualizar
# cucumber.filter.tags=@actualizar and not @wip